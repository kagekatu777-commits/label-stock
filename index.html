<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>ラベル在庫管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:sans-serif;
    background:#f4f6f8;
    color:#222;
}

h1{
    font-size:28px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    font-size:26px;
    margin:0 0 20px;
}

label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:20px;
    font-size:24px;
    border:1px solid #ccc;
    border-radius:15px;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:18px 25px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    width:100%;
    background:#1976d2;
    color:white;
}

.use-btn{
    width:100%;
    background:#2e8b57;
    color:white;
    margin-top:15px;
}

.select-btn{
    background:#e8edf3;
    color:#222;
    padding:15px 25px;
}

.message{
    margin-top:18px;
    font-size:20px;
}

.success{
    color:#2e7d32;
    font-weight:bold;
}

.warning{
    color:#d32f2f;
    font-weight:bold;
}

.search-note{
    color:#777;
    font-size:18px;
    margin-bottom:10px;
}

.result{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.result-info{
    flex:1;
}

.label-name{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.stock{
    font-size:22px;
}

.selected-name{
    font-size:30px;
    font-weight:bold;
}

.selected-stock{
    font-size:22px;
    margin-top:10px;
}

.hidden{
    display:none;
}


/* =========================
   現在庫一覧
========================= */

.inventory-item{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.inventory-label{
    font-size:25px;
    font-weight:bold;
}

.inventory-stock{
    font-size:24px;
    font-weight:bold;
}

.stock-ok{
    color:#1976d2;
}

.stock-zero{
    color:#d32f2f;
}

.empty-inventory{
    color:#777;
    font-size:18px;
}


/* =========================
   履歴
========================= */

.history-item{
    border-top:1px solid #ddd;
    padding:18px 0;
}

.history-date{
    color:#777;
    font-size:16px;
    margin-bottom:5px;
}

.history-label{
    font-size:22px;
    font-weight:bold;
}

.history-count{
    font-size:20px;
    margin-top:5px;
}

.history-in{
    color:#1976d2;
    font-weight:bold;
}

.history-out{
    color:#d32f2f;
    font-weight:bold;
}

.clear-history{
    width:100%;
    margin-top:20px;
    background:#e53935;
    color:white;
    font-size:18px;
}

.empty-history{
    color:#777;
    font-size:18px;
}

</style>
</head>

<body>

<h1>ラベル在庫管理</h1>


<!-- =========================
     ラベル登録
========================= -->

<div class="card">

<h2>ラベル登録</h2>

<label>ラベル番号</label>

<input
    type="text"
    id="labelNumber"
    placeholder="例：25-1"
>

<label>個数</label>

<input
    type="number"
    id="labelCount"
    placeholder="例：5"
    min="1"
>

<button
    class="register-btn"
    onclick="registerLabel()"
>
登録する
</button>

<div id="registerMessage" class="message"></div>

</div>


<!-- =========================
     ラベル検索
========================= -->

<div class="card">

<h2>ラベル検索</h2>

<input
    type="text"
    id="searchInput"
    placeholder="ラベル番号を入力"
    oninput="searchLabels()"
>

<div class="search-note">
候補をタップすると、そのラベルを選択できます。
</div>

<div id="searchResults"></div>

</div>


<!-- =========================
     現在庫一覧
========================= -->

<div class="card">

<h2>現在庫一覧</h2>

<div id="inventoryList"></div>

</div>


<!-- =========================
     選択中のラベル
========================= -->

<div class="card">

<h2>選択中のラベル</h2>

<div id="selectedLabel">
ラベルを選択してください。
</div>

<div
    id="useArea"
    class="hidden"
>

<label style="margin-top:25px;">
使用する個数
</label>

<input
    type="number"
    id="useCount"
    placeholder="例：5"
    min="1"
>

<button
    class="use-btn"
    onclick="useLabels()"
>
出庫する
</button>

<div id="useMessage" class="message"></div>

</div>

</div>


<!-- =========================
     入出庫履歴
========================= -->

<div class="card">

<h2>入出庫履歴</h2>

<div id="historyList"></div>

<button
    class="clear-history"
    onclick="clearHistory()"
>
履歴をすべて削除
</button>

</div>


<script>

/* =========================
   データ読み込み
========================= */

let labels = JSON.parse(
    localStorage.getItem("labelInventory") || "{}"
);

let history = JSON.parse(
    localStorage.getItem("labelHistory") || "[]"
);

let selectedLabel = null;


/* =========================
   日時を作る
========================= */

function getDateTime(){

    const now = new Date();

    return (
        now.getFullYear()
        + "/"
        + String(now.getMonth() + 1).padStart(2,"0")
        + "/"
        + String(now.getDate()).padStart(2,"0")
        + " "
        + String(now.getHours()).padStart(2,"0")
        + ":"
        + String(now.getMinutes()).padStart(2,"0")
    );
}


/* =========================
   ラベル登録
========================= */

function registerLabel(){

    const number =
        document
        .getElementById("labelNumber")
        .value
        .trim();

    const count =
        Number(
            document
            .getElementById("labelCount")
            .value
        );

    const message =
        document
        .getElementById("registerMessage");


    if(!number){

        message.textContent =
            "ラベル番号を入力してください。";

        message.className =
            "message warning";

        return;
    }


    if(!count || count <= 0){

        message.textContent =
            "個数を入力してください。";

        message.className =
            "message warning";

        return;
    }


    /* 在庫を追加 */

    if(labels[number]){

        labels[number] += count;

    }else{

        labels[number] = count;

    }


    /* 入庫履歴 */

    history.unshift({

        date:getDateTime(),

        label:number,

        type:"入庫",

        count:count

    });


    saveData();


    message.textContent =
        number
        + " を "
        + count
        + "個 入庫しました。";

    message.className =
        "message success";


    document
        .getElementById("labelNumber")
        .value = "";

    document
        .getElementById("labelCount")
        .value = "";


    searchLabels();

    showInventory();

    showHistory();

}


/* =========================
   ラベル検索
========================= */

function searchLabels(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .trim();

    const results =
        document
        .getElementById("searchResults");

    results.innerHTML = "";


    const keys =
        Object.keys(labels);


    const filtered =
        keys.filter(function(key){

            return key
                .toLowerCase()
                .includes(
                    keyword.toLowerCase()
                );

        });


    filtered.forEach(function(key){

        const div =
            document.createElement("div");

        div.className = "result";


        div.innerHTML = `

            <div class="result-info">

                <div class="label-name">
                    ${key}
                </div>

                <div class="stock">
                    在庫：${labels[key]}個
                </div>

            </div>

            <button
                class="select-btn"
                onclick="selectLabel('${key}')"
            >
                選択
            </button>

        `;


        results.appendChild(div);

    });

}


/* =========================
   現在庫一覧
========================= */

function showInventory(){

    const list =
        document.getElementById(
            "inventoryList"
        );


    list.innerHTML = "";


    const keys =
        Object.keys(labels);


    if(keys.length === 0){

        list.innerHTML =
            '<div class="empty-inventory">登録されているラベルはありません。</div>';

        return;
    }


    keys.forEach(function(key){

        const stock =
            labels[key];


        const div =
            document.createElement("div");

        div.className =
            "inventory-item";


        const stockClass =
            stock === 0
            ? "stock-zero"
            : "stock-ok";


        div.innerHTML = `

            <div class="inventory-label">
                ラベル：${key}
            </div>

            <div class="inventory-stock ${stockClass}">
                ${stock}個
            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   ラベル選択
========================= */

function selectLabel(number){

    selectedLabel = number;


    const area =
        document.getElementById(
            "selectedLabel"
        );


    area.innerHTML = `

        <div class="selected-name">
            ${number}
        </div>

        <div class="selected-stock">
            現在庫：
            <strong>
                ${labels[number]}個
            </strong>
        </div>

    `;


    document
        .getElementById("useArea")
        .classList.remove("hidden");


    document
        .getElementById("useCount")
        .value = "";


    document
        .getElementById("useMessage")
        .textContent = "";


    document
        .getElementById("useCount")
        .focus();

}


/* =========================
   ラベル出庫
========================= */

function useLabels(){

    if(!selectedLabel){
        return;
    }


    const count =
        Number(
            document
            .getElementById("useCount")
            .value
        );


    const message =
        document
        .getElementById("useMessage");


    const currentStock =
        labels[selectedLabel];


    if(!count || count <= 0){

        message.textContent =
            "使用する個数を入力してください。";

        message.className =
            "message warning";

        return;
    }


    if(count > currentStock){

        message.textContent =
            "在庫が足りません。現在庫は "
            + currentStock
            + "個です。";

        message.className =
            "message warning";

        return;
    }


    /* 在庫を減らす */

    labels[selectedLabel] =
        currentStock - count;


    /* 出庫履歴 */

    history.unshift({

        date:getDateTime(),

        label:selectedLabel,

        type:"出庫",

        count:count

    });


    saveData();


    /* 選択中ラベル更新 */

    document
        .getElementById("selectedLabel")
        .innerHTML = `

            <div class="selected-name">
                ${selectedLabel}
            </div>

            <div class="selected-stock">
                現在庫：
                <strong>
                    ${labels[selectedLabel]}個
                </strong>
            </div>

        `;


    message.textContent =
        selectedLabel
        + " を "
        + count
        + "個 出庫しました。";


    message.className =
        "message success";


    document
        .getElementById("useCount")
        .value = "";


    searchLabels();

    showInventory();

    showHistory();

}


/* =========================
   データ保存
========================= */

function saveData(){

    localStorage.setItem(
        "labelInventory",
        JSON.stringify(labels)
    );

    localStorage.setItem(
        "labelHistory",
        JSON.stringify(history)
    );

}


/* =========================
   入出庫履歴表示
========================= */

function showHistory(){

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    if(history.length === 0){

        list.innerHTML =
            '<div class="empty-history">入出庫履歴はありません。</div>';

        return;
    }


    history.forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "history-item";


        const typeClass =
            item.type === "入庫"
            ? "history-in"
            : "history-out";


        div.innerHTML = `

            <div class="history-date">
                ${item.date}
            </div>

            <div class="history-label">
                ラベル：${item.label}
            </div>

            <div class="history-count ${typeClass}">
                ${item.type}：${item.count}個
            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   履歴削除
========================= */

function clearHistory(){

    if(history.length === 0){
        return;
    }


    const result =
        confirm(
            "入出庫履歴をすべて削除しますか？"
        );


    if(!result){
        return;
    }


    history = [];

    saveData();

    showHistory();

}


/* =========================
   起動時
========================= */

searchLabels();

showInventory();

showHistory();

</script>

</body>
</html>
