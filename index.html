<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>ラベル在庫管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:sans-serif;
    background:#f4f6f8;
    color:#222;
}

h1{
    font-size:28px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    font-size:26px;
    margin:0 0 20px;
}

label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:20px;
    font-size:24px;
    border:1px solid #ccc;
    border-radius:15px;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:18px 25px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    width:100%;
    background:#1976d2;
    color:white;
}

.use-btn{
    width:100%;
    background:#2e8b57;
    color:white;
    margin-top:15px;
}

.select-btn{
    background:#e8edf3;
    color:#222;
    padding:15px 25px;
}

.message{
    margin-top:18px;
    font-size:20px;
}

.success{
    color:#2e7d32;
    font-weight:bold;
}

.warning{
    color:#d32f2f;
    font-weight:bold;
}

.search-note{
    color:#777;
    font-size:18px;
    margin-bottom:10px;
}

.result{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.result-info{
    flex:1;
}

.label-name{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.stock{
    font-size:22px;
}

.selected-name{
    font-size:30px;
    font-weight:bold;
}

.selected-stock{
    font-size:22px;
    margin-top:10px;
}

.hidden{
    display:none;
}


/* =========================
   現在庫一覧
========================= */

.inventory-toggle{
    width:100%;
    background:#607d8b;
    color:white;
}

.inventory-toggle.open{
    background:#455a64;
}

.inventory-item{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.inventory-label{
    font-size:25px;
    font-weight:bold;
}

.inventory-stock{
    font-size:24px;
    font-weight:bold;
}

.stock-ok{
    color:#1976d2;
}

.stock-zero{
    color:#d32f2f;
}

.empty-inventory{
    color:#777;
    font-size:18px;
}


/* =========================
   入出庫履歴
========================= */

.history-item{
    border-top:1px solid #ddd;
    padding:18px 0;
}

.history-date{
    color:#777;
    font-size:16px;
    margin-bottom:5px;
}

.history-label{
    font-size:22px;
    font-weight:bold;
}

.history-count{
    font-size:20px;
    margin-top:5px;
}

.history-in{
    color:#1976d2;
    font-weight:bold;
}

.history-out{
    color:#d32f2f;
    font-weight:bold;
}

.clear-history{
    width:100%;
    margin-top:20px;
    background:#e53935;
    color:white;
    font-size:18px;
}

.empty-history{
    color:#777;
    font-size:18px;
}

</style>
</head>

<body>

<h1>ラベル在庫管理</h1>


<!-- =========================
     ラベル登録
========================= -->

<div class="card">

<h2>ラベル登録</h2>

<label>ラベル番号</label>

<input
    type="text"
    id="labelNumber"
    placeholder="例：25-1"
>

<label>個数</label>

<input
    type="number"
    id="labelCount"
    placeholder="例：5"
    min="1"
>

<button
    class="register-btn"
    onclick="registerLabel()"
>
登録する
</button>

<div id="registerMessage" class="message"></div>

</div>


<!-- =========================
     ラベル検索
========================= -->

<div class="card">

<h2>ラベル検索</h2>

<input
    type="text"
    id="searchInput"
    placeholder="ラベル番号を入力"
    oninput="searchLabels()"
>

<div class="search-note">
候補をタップすると、そのラベルを選択できます。
</div>

<div id="searchResults"></div>

</div>


<!-- =========================
     現在庫一覧
========================= -->

<div class="card">

<button
    class="inventory-toggle"
    onclick="toggleInventory()"
    id="inventoryButton"
>
📦 現在庫一覧を見る
</button>

<div
    id="inventoryArea"
    class="hidden"
    style="margin-top:25px;"
>

<h2>現在庫一覧</h2>

<div id="inventoryList"></div>

</div>

</div>


<!-- =========================
     選択中のラベル
========================= -->

<div class="card">

<h2>選択中のラベル</h2>

<div id="selectedLabel">
ラベルを選択してください。
</div>

<div
    id="useArea"
    class="hidden"
>

<label style="margin-top:25px;">
使用する個数
</label>

<input
    type="number"
    id="useCount"
    placeholder="例：5"
    min="1"
>

<button
    class="use-btn"
    onclick="useLabels()"
>
出庫する
</button>

<div id="useMessage" class="message"></div>

</div>

</div>


<!-- =========================
     入出庫履歴
========================= -->

<div class="card">
