<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>ラベル在庫管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:sans-serif;
    background:#f4f6f8;
    color:#222;
}

h1{
    font-size:28px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    font-size:26px;
    margin:0 0 20px;
}

label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:20px;
    font-size:24px;
    border:1px solid #ccc;
    border-radius:15px;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:18px 25px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    width:100%;
    background:#1976d2;
    color:white;
}

.use-btn{
    width:100%;
    background:#2e8b57;
    color:white;
    margin-top:15px;
}

.select-btn{
    background:#e8edf3;
    color:#222;
    padding:15px 20px;
}

.delete-btn{
    background:#e53935;
    color:white;
    padding:12px 16px;
    font-size:17px;
}

.message{
    margin-top:18px;
    font-size:20px;
}

.success{
    color:#2e7d32;
    font-weight:bold;
}

.warning{
    color:#d32f2f;
    font-weight:bold;
}


/* 男女選択 */

.gender-area{
    display:flex;
    gap:12px;
    margin-bottom:20px;
}

.gender-btn{
    flex:1;
    background:#e8edf3;
    color:#333;
    padding:18px 10px;
}

.gender-btn.selected{
    background:#1976d2;
    color:white;
}


/* 検索 */

.search-note{
    color:#777;
    font-size:18px;
    margin-bottom:10px;
}

.result{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.result-info{
    flex:1;
}

.label-name{
    font-size:26px;
    font-weight:bold;
}

.gender-name{
    display:inline-block;
    margin-top:6px;
    padding:5px 12px;
    border-radius:8px;
    background:#eee;
    font-size:18px;
    font-weight:bold;
}

.stock{
    font-size:22px;
    margin-top:6px;
}

.selected-name{
    font-size:30px;
    font-weight:bold;
}

.selected-gender{
    font-size:22px;
    margin-top:5px;
    font-weight:bold;
}

.selected-stock{
    font-size:22px;
    margin-top:10px;
}

.hidden{
    display:none;
}


/* 現在庫 */

.inventory-toggle{
    width:100%;
    background:#607d8b;
    color:white;
}

.inventory-toggle.open{
    background:#455a64;
}

.inventory-item{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.inventory-info{
    flex:1;
    min-width:0;
}

.inventory-label{
    font-size:25px;
    font-weight:bold;
}

.inventory-gender{
    display:inline-block;
    margin-top:5px;
    padding:5px 12px;
    border-radius:8px;
    background:#eee;
    font-size:18px;
    font-weight:bold;
}

.inventory-stock{
    font-size:24px;
    font-weight:bold;
    margin-top:5px;
}

.inventory-actions{
    flex-shrink:0;
}

.stock-ok{
    color:#1976d2;
}

.stock-zero{
    color:#d32f2f;
}

.empty-inventory{
    color:#777;
    font-size:18px;
}


/* 履歴 */

.history-item{
    border-top:1px solid #ddd;
    padding:18px 0;
}

.history-date{
    color:#777;
    font-size:16px;
    margin-bottom:5px;
}

.history-label{
    font-size:22px;
    font-weight:bold;
}

.history-gender{
    font-size:19px;
    font-weight:bold;
    margin-top:4px;
}

.history-count{
    font-size:20px;
    margin-top:5px;
}

.history-in{
    color:#1976d2;
    font-weight:bold;
}

.history-out{
    color:#d32f2f;
    font-weight:bold;
}

.clear-history{
    width:100%;
    margin-top:20px;
    background:#e53935;
    color:white;
    font-size:18px;
}

.empty-history{
    color:#777;
    font-size:18px;
}


/* =========================
   戻るボタン
========================= */

.back-btn{
    width:100%;
    background:#777;
    color:white;
    margin-top:0;
    margin-bottom:24px;
    padding:18px;
    font-size:22px;
}

.back-btn:active{
    transform:scale(0.98);
}


@media(max-width:500px){

    .inventory-label{
        font-size:22px;
    }

    .inventory-stock{
        font-size:20px;
    }

    .delete-btn{
        padding:11px 13px;
        font-size:16px;
    }

}
</style>
</head>

<body>

<h1>ラベル在庫管理</h1>


<!-- =========================
     ラベル登録
========================= -->

<div class="card">

<h2>ラベル登録</h2>

<label>ラベル番号</label>

<input
    type="text"
    id="labelNumber"
    placeholder="例：25-1"
>

<label>区分</label>

<div class="gender-area">

<button
    type="button"
    class="gender-btn selected"
    id="maleBtn"
    onclick="selectGender('男')"
>
男
</button>

<button
    type="button"
    class="gender-btn"
    id="femaleBtn"
    onclick="selectGender('女')"
>
女
</button>

</div>

<label>個数</label>

<input
    type="number"
    id="labelCount"
    placeholder="例：5"
    min="1"
>

<button
    class="register-btn"
    onclick="registerLabel()"
>
登録する
</button>

<div id="registerMessage" class="message"></div>

</div>


<!-- =========================
     ラベル検索
========================= -->

<div class="card">

<h2>ラベル検索</h2>

<input
    type="text"
    id="searchInput"
    placeholder="ラベル番号を入力"
    oninput="searchLabels()"
>

<div class="search-note">
ラベル番号を入力してください。
<br>
完全一致するラベルがあれば、それを優先して表示します。
</div>

<div id="searchResults"></div>

</div>


<!-- =========================
     現在庫一覧
========================= -->

<div class="card">

<button
    class="inventory-toggle"
    onclick="toggleInventory()"
    id="inventoryButton"
>
📦 現在庫一覧を見る
</button>

<div
    id="inventoryArea"
    class="hidden"
    style="margin-top:25px;"
>

<h2>現在庫一覧</h2>

<div id="inventoryList"></div>

</div>

</div>


<!-- =========================
     戻るボタン
========================= -->

<div class="card">

<button
    class="back-btn"
    onclick="goBack()"
>
← 前の画面に戻る
</button>

</div>


<!-- =========================
     選択中
========================= -->

<div class="card">

<h2>選択中のラベル</h2>

<div id="selectedLabel">
ラベルを選択してください。
</div>

<div
    id="useArea"
    class="hidden"
>

<label style="margin-top:25px;">
使用する個数
</label>

<input
    type="number"
    id="useCount"
    placeholder="例：5"
    min="1"
>

<button
    class="use-btn"
    onclick="useLabels()"
>
出庫する
</button>

<div id="useMessage" class="message"></div>

</div>

</div>


<!-- =========================
     履歴
========================= -->

<div class="card">

<h2>入出庫履歴</h2>

<div id="historyList"></div>

<button
    class="clear-history"
    onclick="clearHistory()"
>
履歴をすべて削除
</button>

</div>


<script>

/* =========================
   データ
========================= */

let labels =
    JSON.parse(
        localStorage.getItem("labelInventory") || "{}"
    );

let history =
    JSON.parse(
        localStorage.getItem("labelHistory") || "[]"
    );

let selectedLabel = null;
let selectedGender = "男";


/* =========================
   戻る
========================= */

function goBack(){

    if(history.length > 0){

        window.history.back();

    }else{

        window.location.href = "index.html";

    }

}


/* =========================
   男女選択
========================= */

function selectGender(gender){

    selectedGender = gender;

    document
        .getElementById("maleBtn")
        .classList.remove("selected");

    document
        .getElementById("femaleBtn")
        .classList.remove("selected");


    if(gender === "男"){

        document
            .getElementById("maleBtn")
            .classList.add("selected");

    }else{

        document
            .getElementById("femaleBtn")
            .classList.add("selected");

    }

}


/* =========================
   データキー
========================= */

function getKey(number, gender){

    return number + "___" + gender;

}


/* =========================
   日時
========================= */

function getDateTime(){

    const now = new Date();

    return (
        now.getFullYear()
        + "/"
        + String(now.getMonth()+1).padStart(2,"0")
        + "/"
        + String(now.getDate()).padStart(2,"0")
        + " "
        + String(now.getHours()).padStart(2,"0")
        + ":"
        + String(now.getMinutes()).padStart(2,"0")
    );

}


/* =========================
   登録
========================= */

function registerLabel(){

    const number =
        document
        .getElementById("labelNumber")
        .value
        .trim();

    const count =
        Number(
            document
            .getElementById("labelCount")
            .value
        );

    const message =
        document
        .getElementById("registerMessage");


    if(!number){

        message.textContent =
            "ラベル番号を入力してください。";

        message.className =
            "message warning";

        return;

    }


    if(!count || count <= 0){

        message.textContent =
            "個数を入力してください。";

        message.className =
            "message warning";

        return;

    }


    const key =
        getKey(number, selectedGender);


    if(labels[key]){

        labels[key] += count;

    }else{

        labels[key] = count;

    }


    history.unshift({

        date:getDateTime(),

        label:number,

        gender:selectedGender,

        type:"入庫",

        count:count

    });


    saveData();


    message.textContent =
        number
        + "・"
        + selectedGender
        + " を "
        + count
        + "個 入庫しました。";

    message.className =
        "message success";


    document
        .getElementById("labelNumber")
        .value = "";

    document
        .getElementById("labelCount")
        .value = "";


    showInventory();
    showHistory();
    searchLabels();

}


/* =========================
   ラベル検索
========================= */

function searchLabels(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .trim();

    const results =
        document
        .getElementById("searchResults");


    results.innerHTML = "";


    if(keyword === ""){

        return;

    }


    const keys =
        Object.keys(labels);


    /*
       ラベル番号だけ取り出して比較
    */

    const exactMatches =
        keys.filter(function(key){

            const parts =
                key.split("___");

            const number =
                parts[0];

            return number === keyword;

        });


    /*
       完全一致があれば
       完全一致だけ表示
    */

    let filtered;


    if(exactMatches.length > 0){

        filtered = exactMatches;

    }else{

        /*
           完全一致がなければ
           部分一致
        */

        filtered =
            keys.filter(function(key){

                const parts =
                    key.split("___");

                const number =
                    parts[0];

                return number
                    .toLowerCase()
                    .includes(
                        keyword.toLowerCase()
                    );

            });

    }


    filtered.forEach(function(key){

        const parts =
            key.split("___");

        const number =
            parts[0];

        const gender =
            parts[1];

        const div =
            document.createElement("div");

        div.className =
            "result";


        div.innerHTML = `

            <div class="result-info">

                <div class="label-name">
                    ${number}
                </div>

                <div class="gender-name">
                    ${gender}
                </div>

                <div class="stock">
                    在庫：${labels[key]}個
                </div>

            </div>

            <button
                class="select-btn"
                onclick="selectLabel('${number}','${gender}')"
            >
                選択
            </button>

        `;


        results.appendChild(div);

    });


    if(filtered.length === 0){

        results.innerHTML = `

            <div class="empty-inventory">
                該当するラベルがありません。
            </div>

        `;

    }

}


/* =========================
   現在庫一覧
========================= */

function showInventory(){

    const list =
        document.getElementById(
            "inventoryList"
        );


    list.innerHTML = "";


    const keys =
        Object.keys(labels);


    if(keys.length === 0){

        list.innerHTML =
            '<div class="empty-inventory">登録されているラベルはありません。</div>';

        return;

    }


    keys.forEach(function(key){

        const parts =
            key.split("___");

        const number =
            parts[0];

        const gender =
            parts[1];

        const stock =
            labels[key];


        const div =
            document.createElement("div");

        div.className =
            "inventory-item";


        const stockClass =
            stock === 0
            ? "stock-zero"
            : "stock-ok";


        div.innerHTML = `

            <div class="inventory-info">

                <div class="inventory-label">
                    ラベル：${number}
                </div>

                <div class="inventory-gender">
                    ${gender}
                </div>

                <div class="inventory-stock ${stockClass}">
                    在庫：${stock}個
                </div>

            </div>

            <div class="inventory-actions">

                <button
                    class="delete-btn"
                    onclick="deleteLabel('${number}','${gender}')"
                >
                    🗑️ 削除
                </button>

            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   在庫削除
========================= */

function deleteLabel(number, gender){

    const key =
        getKey(number, gender);


    if(
        !Object.prototype.hasOwnProperty.call(
            labels,
            key
        )
    ){

        return;

    }


    const stock =
        labels[key];


    const result =
        confirm(
            "ラベル「"
            + number
            + "・"
            + gender
            + "」を削除しますか？\n\n"
            + "現在庫："
            + stock
            + "個\n\n"
            + "※この操作は取り消せません。"
        );


    if(!result){

        return;

    }


    delete labels[key];


    if(
        selectedLabel === number &&
        selectedGender === gender
    ){

        selectedLabel = null;


        document
            .getElementById("selectedLabel")
            .textContent =
                "ラベルを選択してください。";


        document
            .getElementById("useArea")
            .classList.add("hidden");

    }


    saveData();


    showInventory();
    searchLabels();


    const message =
        document.getElementById(
            "registerMessage"
        );


    message.textContent =
        "ラベル「"
        + number
        + "・"
        + gender
        + "」を削除しました。";

    message.className =
        "message success";

}


/* =========================
   一覧開閉
========================= */

function toggleInventory(){

    const area =
        document.getElementById(
            "inventoryArea"
        );

    const button =
        document.getElementById(
            "inventoryButton"
        );


    if(area.classList.contains("hidden")){

        area.classList.remove("hidden");

        button.classList.add("open");

        button.textContent =
            "📦 現在庫一覧を閉じる";

    }else{

        area.classList.add("hidden");

        button.classList.remove("open");

        button.textContent =
            "📦 現在庫一覧を見る";

    }

}


/* =========================
   ラベル選択
========================= */

function selectLabel(number, gender){

    selectedLabel = number;
    selectedGender = gender;


    const key =
        getKey(number,gender);


    const area =
        document.getElementById(
            "selectedLabel"
        );


    area.innerHTML = `

        <div class="selected-name">
            ${number}
        </div>

        <div class="selected-gender">
            区分：${gender}
        </div>

        <div class="selected-stock">
            現在庫：
            <strong>
                ${labels[key]}個
            </strong>
        </div>

    `;


    document
        .getElementById("useArea")
        .classList.remove("hidden");


    document
        .getElementById("useCount")
        .value = "";


    document
        .getElementById("useMessage")
        .textContent = "";


    document
        .getElementById("useCount")
        .focus();

}


/* =========================
   出庫
========================= */

function useLabels(){

    if(!selectedLabel){

        return;

    }


    const key =
        getKey(
            selectedLabel,
            selectedGender
        );


    const count =
        Number(
            document
            .getElementById("useCount")
            .value
        );


    const message =
        document
        .getElementById("useMessage");


    const currentStock =
        labels[key];


    if(!count || count <= 0){

        message.textContent =
            "使用する個数を入力してください。";

        message.className =
            "message warning";

        return;

    }


    if(count > currentStock){

        message.textContent =
            "在庫が足りません。現在庫は "
            + currentStock
            + "個です。";

        message.className =
            "message warning";

        return;

    }


    labels[key] =
        currentStock - count;


    history.unshift({

        date:getDateTime(),

        label:selectedLabel,

        gender:selectedGender,

        type:"出庫",

        count:count

    });


    saveData();


    document
        .getElementById("selectedLabel")
        .innerHTML = `

            <div class="selected-name">
                ${selectedLabel}
            </div>

            <div class="selected-gender">
                区分：${selectedGender}
            </div>

            <div class="selected-stock">
                現在庫：
                <strong>
                    ${labels[key]}個
                </strong>
            </div>

        `;


    message.textContent =
        selectedLabel
        + "・"
        + selectedGender
        + " を "
        + count
        + "個 出庫しました。";


    message.className =
        "message success";


    document
        .getElementById("useCount")
        .value = "";


    showInventory();
    showHistory();
    searchLabels();

}


/* =========================
   保存
========================= */

function saveData(){

    localStorage.setItem(
        "labelInventory",
        JSON.stringify(labels)
    );

    localStorage.setItem(
        "labelHistory",
        JSON.stringify(history)
    );

}


/* =========================
   履歴
========================= */

function showHistory(){

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    if(history.length === 0){

        list.innerHTML =
            '<div class="empty-history">入出庫履歴はありません。</div>';

        return;

    }


    history.forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "history-item";


        const typeClass =
            item.type === "入庫"
            ? "history-in"
            : "history-out";


        div.innerHTML = `

            <div class="history-date">
                ${item.date}
            </div>

            <div class="history-label">
                ラベル：${item.label}
            </div>

            <div class="history-gender">
                区分：${item.gender || "男"}
            </div>

            <div class="history-count ${typeClass}">
                ${item.type}：${item.count}個
            </div>

        `;


        list.appendChild(div);

    });

}


/* =========================
   履歴削除
========================= */

function clearHistory(){

    if(history.length === 0){

        return;

    }


    const result =
        confirm(
            "入出庫履歴をすべて削除しますか？"
        );


    if(!result){

        return;

    }


    history = [];


    saveData();

    showHistory();

}


/* =========================
   起動時
========================= */

searchLabels();

showInventory();

showHistory();

</script>

</body>
</html>
