<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">
<title>ラベル在庫管理</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:16px;
    font-family:sans-serif;
    background:#f4f6f8;
    color:#222;
}

h1{
    font-size:28px;
    margin:10px 0 20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px;
    margin-bottom:24px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

h2{
    font-size:26px;
    margin:0 0 20px;
}

label{
    display:block;
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:20px;
    font-size:24px;
    border:1px solid #ccc;
    border-radius:15px;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:18px 25px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

.register-btn{
    width:100%;
    background:#1976d2;
    color:white;
}

.use-btn{
    width:100%;
    background:#2e8b57;
    color:white;
    margin-top:15px;
}

.select-btn{
    background:#e8edf3;
    color:#222;
    padding:15px 25px;
}

.message{
    margin-top:18px;
    font-size:20px;
    color:#2e7d32;
}

.search-note{
    color:#777;
    font-size:18px;
    margin-bottom:10px;
}

.result{
    border-top:1px solid #ddd;
    padding:20px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.result-info{
    flex:1;
}

.label-name{
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.stock{
    font-size:22px;
}

.selected-name{
    font-size:30px;
    font-weight:bold;
}

.selected-stock{
    font-size:22px;
    margin-top:10px;
}

.hidden{
    display:none;
}

.warning{
    color:#d32f2f;
    font-weight:bold;
}

.success{
    color:#2e7d32;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>ラベル在庫管理</h1>

<!-- 登録 -->
<div class="card">

<h2>ラベル登録</h2>

<label>ラベル番号</label>
<input
    type="text"
    id="labelNumber"
    placeholder="例：25-1"
>

<label>個数</label>
<input
    type="number"
    id="labelCount"
    placeholder="例：5"
    min="1"
>

<button
    class="register-btn"
    onclick="registerLabel()"
>
登録する
</button>

<div id="registerMessage" class="message"></div>

</div>


<!-- 検索 -->
<div class="card">

<h2>ラベル検索</h2>

<input
    type="text"
    id="searchInput"
    placeholder="ラベル番号を入力"
    oninput="searchLabels()"
>

<div class="search-note">
候補をタップすると、そのラベルを選択できます。
</div>

<div id="searchResults"></div>

</div>


<!-- 選択中 -->
<div
    class="card"
    id="selectedCard"
>

<h2>選択中のラベル</h2>

<div id="selectedLabel">
ラベルを選択してください。
</div>

<div
    id="useArea"
    class="hidden"
>

<label style="margin-top:25px;">
使用する個数
</label>

<input
    type="number"
    id="useCount"
    placeholder="例：5"
    min="1"
>

<button
    class="use-btn"
    onclick="useLabels()"
>
使用する
</button>

<div id="useMessage" class="message"></div>

</div>

</div>


<script>

let labels = JSON.parse(
    localStorage.getItem("labelInventory") || "{}"
);

let selectedLabel = null;


/* =========================
   登録
========================= */

function registerLabel(){

    const number =
        document
        .getElementById("labelNumber")
        .value
        .trim();

    const count =
        Number(
            document
            .getElementById("labelCount")
            .value
        );

    const message =
        document
        .getElementById("registerMessage");

    if(!number){
        message.textContent =
            "ラベル番号を入力してください。";
        message.className =
            "message warning";
        return;
    }

    if(!count || count <= 0){
        message.textContent =
            "個数を入力してください。";
        message.className =
            "message warning";
        return;
    }

    if(labels[number]){
        labels[number] += count;
    }else{
        labels[number] = count;
    }

    saveData();

    message.textContent =
        number + " を " + count + "個 登録しました。";

    message.className =
        "message success";

    document
        .getElementById("labelNumber")
        .value = "";

    document
        .getElementById("labelCount")
        .value = "";

    searchLabels();
}


/* =========================
   検索
========================= */

function searchLabels(){

    const keyword =
        document
        .getElementById("searchInput")
        .value
        .trim();

    const results =
        document
        .getElementById("searchResults");

    results.innerHTML = "";

    const keys =
        Object.keys(labels);

    const filtered =
        keys.filter(function(key){

            return key
                .toLowerCase()
                .includes(keyword.toLowerCase());

        });

    filtered.forEach(function(key){

        const div =
            document.createElement("div");

        div.className = "result";

        div.innerHTML = `
            <div class="result-info">

                <div class="label-name">
                    ${key}
                </div>

                <div class="stock">
                    在庫：${labels[key]}個
                </div>

            </div>

            <button
                class="select-btn"
                onclick="selectLabel('${key}')"
            >
                選択
            </button>
        `;

        results.appendChild(div);

    });

}


/* =========================
   ラベル選択
========================= */

function selectLabel(number){

    selectedLabel = number;

    const area =
        document.getElementById("selectedLabel");

    area.innerHTML = `
        <div class="selected-name">
            ${number}
        </div>

        <div class="selected-stock">
            現在庫：
            <strong>${labels[number]}個</strong>
        </div>
    `;

    document
        .getElementById("useArea")
        .class
